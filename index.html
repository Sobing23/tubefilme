<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>tubefilme (Test)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fuse.js/7.0.0/fuse.min.js"></script>
<style>
  :root {
    --bg: #121212;
    --bg-card: #1e1e1e;
    --text: #f2f2f2;
    --text-dim: #9a9a9a;
    --accent: #e5533c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    padding: 16px 20px;
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
    border-bottom: 1px solid #2a2a2a;
  }
  header h1 {
    font-size: 20px;
    margin: 0;
    margin-right: auto;
  }
  header h1 span { color: var(--accent); }
  input[type="search"] {
    flex: 1;
    min-width: 180px;
    max-width: 360px;
    padding: 10px 34px 10px 14px;
    border-radius: 8px;
    border: 1px solid #333;
    background: #1a1a1a;
    color: var(--text);
    font-size: 14px;
  }
  /* Browser-eigenes Clear-Kreuz bei type="search" ausblenden, wir bauen ein eigenes */
  input[type="search"]::-webkit-search-cancel-button { display: none; }
  .search-wrap { position: relative; flex: 1; min-width: 180px; max-width: 360px; }
  .search-wrap input[type="search"] { max-width: none; width: 100%; }
  .search-clear {
    display: none;
    position: absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 18px;
    line-height: 1;
    padding: 4px 8px;
    cursor: pointer;
  }
  .search-clear:hover { color: var(--text); }
  select {
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid #333;
    background: #1a1a1a;
    color: var(--text);
    font-size: 14px;
  }
  button {
    padding: 10px 16px;
    border-radius: 8px;
    border: 1px solid #333;
    background: #1a1a1a;
    color: var(--text);
    cursor: pointer;
    font-size: 14px;
    white-space: nowrap;
  }
  button:hover { border-color: var(--accent); }
  button.active { background: var(--accent); border-color: var(--accent); }

  #status {
    padding: 40px 20px;
    text-align: center;
    color: var(--text-dim);
  }

  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 14px;
    padding: 20px;
  }
  .card {
    cursor: pointer;
  }
  .poster-frame {
    position: relative;
  }
  .card img {
    width: 100%;
    aspect-ratio: 2 / 3;
    object-fit: cover;
    border-radius: 6px;
    background: #222;
    display: block;
  }
  .card .meta {
    padding-top: 6px;
    font-size: 13px;
    line-height: 1.3;
  }
  .card .year {
    color: var(--text-dim);
    font-size: 12px;
  }
  .card .fav {
    position: absolute;
    top: 6px;
    right: 6px;
    background: rgba(0,0,0,0.6);
    border: none;
    border-radius: 50%;
    width: 36px;
    height: 36px;
    font-size: 17px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .card .fav.active { color: var(--accent); }
  .card .low-confidence {
    position: absolute;
    top: 6px;
    left: 6px;
    background: rgba(0,0,0,0.6);
    border-radius: 4px;
    font-size: 10px;
    padding: 2px 5px;
    color: var(--text-dim);
  }
  .fsk-badge {
    display: inline-block;
    background: #333;
    border-radius: 4px;
    font-size: 11px;
    padding: 1px 6px;
    font-weight: bold;
  }
  .poster-frame .fsk-badge {
    position: absolute;
    bottom: 6px;
    right: 6px;
    background: rgba(0,0,0,0.75);
  }
  /* Vorschaubild im Querformat, eingepasst in den Hochformat-Rahmen der
     Kachel. Der freie Rand wird mit einer unscharfen Version desselben
     Bildes gefüllt -- dadurch geht kein Bildinhalt durch Beschnitt verloren
     und die Kachel wirkt trotzdem wie ein Poster. Beide Bilder nutzen
     dieselbe URL, der Browser lädt sie also nur einmal. */
  .poster-yt {
    position: relative;
    width: 100%;
    aspect-ratio: 2 / 3;
    overflow: hidden;
    border-radius: 6px;
    background: #111;
  }
  .poster-yt-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: blur(20px) brightness(0.45);
    transform: scale(1.15);
  }
  .poster-yt-img {
    position: absolute;
    top: 50%;
    left: 50%;
    /* Leicht über die Kachelbreite hinaus vergrößert: so füllt das Motiv
       den Rahmen spürbar besser aus, ohne dass -- wie bei einem harten
       Zuschnitt auf Hochformat -- der halbe Bildinhalt verloren geht. */
    width: 145%;
    transform: translate(-50%, -50%);
    display: block;
  }
  .poster-placeholder {    width: 100%;
    aspect-ratio: 2 / 3;
    border-radius: 6px;
    background: linear-gradient(160deg, #2a2a2a, #1a1a1a);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 10px;
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.3;
  }

  .similar-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-top: 22px;
  }
  .similar-row h4 {
    grid-column: 1 / -1;
    margin: 0 0 4px 0;
    font-size: 13px;
    color: var(--text-dim);
    font-weight: normal;
  }
  .similar-card { cursor: pointer; }
  .similar-card > img, .similar-card .poster-placeholder, .similar-card .poster-yt {
    width: 100%;
    aspect-ratio: 2/3;
    object-fit: cover;
    border-radius: 6px;
    display: block;
  }
  .similar-card .similar-title {
    font-size: 12px;
    margin-top: 4px;
    line-height: 1.3;
  }

  #count {
    padding: 0 20px;
    color: var(--text-dim);
    font-size: 13px;
  }

  @media (max-width: 640px) {
    header { padding: 12px 14px; gap: 8px; }
    header h1 { width: 100%; }
    header h1 small { display: none; }
    .search-wrap { max-width: none; width: 100%; order: 3; }
    select { order: 4; width: 100%; }
    #grid { padding: 14px; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(105px, 1fr)); }
    #count { padding: 0 14px; }
    .player-wrap { padding: 0 12px; margin: 70px auto 30px; }
    #closeBtn { top: 10px; right: 12px; }
  }

  /* Kino-Modus Overlay */
  #overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.95);
    z-index: 100;
    overflow-y: auto;
  }
  #overlay.open { display: block; }
  .player-wrap {
    max-width: 960px;
    margin: 40px auto;
    padding: 0 20px;
  }
  .player-wrap iframe {
    width: 100%;
    aspect-ratio: 16 / 9;
    border: none;
    border-radius: 8px;
  }
  .player-info {
    padding-top: 18px;
  }
  .player-info h2 {
    margin: 0 0 6px 0;
  }
  .player-info .sub {
    color: var(--text-dim);
    font-size: 14px;
    margin-bottom: 14px;
  }
  .player-info p {
    line-height: 1.5;
    color: #ddd;
  }
  #closeBtn {
    position: fixed;
    top: 16px;
    right: 20px;
    z-index: 110;
  }

  /* Zufalls-Auswahl */
  #randomOverlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 120;
    align-items: center;
    justify-content: center;
  }
  #randomOverlay.open { display: flex; }
  .random-panel {
    background: var(--bg-card);
    border-radius: 12px;
    padding: 24px;
    max-width: 720px;
    width: 90%;
    max-height: 85vh;
    overflow-y: auto;
  }
  .random-panel h3 {
    margin: 0 0 16px 0;
  }
  .random-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 14px;
    margin-bottom: 18px;
  }
  .random-panel .actions {
    display: flex;
    gap: 10px;
  }
</style>
</head>
<body>

<header>
  <h1>tube<span>filme</span> <small style="color:var(--text-dim); font-size:12px;">(Test-Ansicht, kein Design)</small></h1>
  <div class="search-wrap" id="searchWrap">
    <input type="search" id="search" placeholder="Filme, Genre, Schauspieler oder Regie durchsuchen...">
    <button type="button" class="search-clear" id="searchClear" aria-label="Suche löschen">×</button>
  </div>
  <select id="genreFilter">
    <option value="">Alle Genres</option>
  </select>
  <select id="fskFilter">
    <option value="">Alle FSK</option>
    <option value="0">FSK 0</option>
    <option value="6">FSK 6</option>
    <option value="12">FSK 12</option>
    <option value="16">FSK 16</option>
    <option value="18">FSK 18</option>
  </select>
  <select id="jahrFilter">
    <option value="">Alle Jahre</option>
  </select>
  <select id="sortierung">
    <option value="relevanz">Sortierung: Standard</option>
    <option value="bewertung">Beste Bewertung</option>
    <option value="az">Titel A–Z</option>
    <option value="za">Titel Z–A</option>
    <option value="neu">Neueste zuerst</option>
    <option value="alt">Älteste zuerst</option>
  </select>
  <button id="randomBtn">🎲 Zufall</button>
  <button id="watchlistBtn">♥ Merkliste</button>
</header>

<div id="status">Lade Filme...</div>
<div id="count"></div>
<div id="grid"></div>

<div id="randomOverlay">
  <div class="random-panel">
    <h3>Was hältst du von diesen?</h3>
    <div class="random-grid" id="randomGrid"></div>
    <div class="actions">
      <button id="randomRerollBtn">🎲 Nochmal würfeln</button>
      <button id="randomCloseBtn">Abbrechen</button>
    </div>
  </div>
</div>

<script>
// Schlanker Index von der eigenen Domain (rund 1,9 statt 7 MB) -- die
// vollständigen Angaben zu einem Film stehen auf dessen eigener Seite.
const FILME_URL = "/data/index.json";

// TMDB-Genre-IDs -> deutsche Namen (stabile, öffentliche Liste)
const GENRES = {28:"Action",12:"Abenteuer",16:"Animation",35:"Komödie",80:"Krimi",
  99:"Dokumentation",18:"Drama",10751:"Familie",14:"Fantasy",36:"Historie",
  27:"Horror",10402:"Musik",9648:"Mystery",10749:"Romantik",878:"Science Fiction",
  10770:"TV-Film",53:"Thriller",10752:"Kriegsfilm",37:"Western"};

let allMovies = [];
let fuse = null;
let watchlistMode = false;

const WATCHLIST_KEY = "tubefilme_merkliste";
function getWatchlist() {
  try { return new Set(JSON.parse(localStorage.getItem(WATCHLIST_KEY) || "[]")); }
  catch { return new Set(); }
}
function saveWatchlist(set) {
  localStorage.setItem(WATCHLIST_KEY, JSON.stringify([...set]));
}
function toggleWatchlist(videoId) {
  const wl = getWatchlist();
  wl.has(videoId) ? wl.delete(videoId) : wl.add(videoId);
  saveWatchlist(wl);
  return wl.has(videoId);
}

function parseDuration(iso) {
  if (!iso) return "";
  const m = iso.match(/PT(?:(\d+)H)?(?:(\d+)M)?/);
  if (!m) return "";
  const h = parseInt(m[1] || 0), min = parseInt(m[2] || 0);
  return h > 0 ? `${h} Std ${min} Min` : `${min} Min`;
}

function genreNames(ids) {
  return (ids || []).map(id => GENRES[id]).filter(Boolean).slice(0, 2).join(", ");
}

function posterHtml(m, extraClass) {
  if (m.posterUrl) {
    return `<img class="${extraClass||''}" src="${m.posterUrl}" loading="lazy" alt="${escapeHtml(m.title)}">`;
  }

  // Filme ohne TMDB-Poster (aus YouTube-Daten übernommen): das Vorschaubild
  // des Videos nutzen. Es liegt im Querformat vor -- statt es hart auf das
  // Hochformat der Kachel zu beschneiden (dabei ginge der halbe Bildinhalt
  // verloren), wird es vollständig eingepasst und der freie Rand mit einer
  // unscharfen, abgedunkelten Version desselben Bildes gefüllt.
  //
  // Die im Datensatz gespeicherte Variante ist "hqdefault" (480x360) -- die
  // hat bei 16:9-Videos schwarze Balken. Deshalb zuerst "maxresdefault"
  // versuchen und nur bei Nichtverfügbarkeit auf die gespeicherte
  // zurückfallen; welche Videos eine hochauflösende Fassung haben, lässt
  // sich nur zur Laufzeit feststellen.
  const gespeichert = m.youtubeThumbnail || (m.videoId ? `https://i.ytimg.com/vi/${m.videoId}/hqdefault.jpg` : "");
  if (gespeichert) {
    const hoch = m.videoId ? `https://i.ytimg.com/vi/${m.videoId}/maxresdefault.jpg` : gespeichert;
    const fallback = `this.onerror=null;this.src='${gespeichert}'`;
    return `<div class="poster-yt ${extraClass||''}">
      <img class="poster-yt-bg" src="${hoch}" onerror="${fallback}" alt="" aria-hidden="true">
      <img class="poster-yt-img" src="${hoch}" onerror="${fallback}" loading="lazy" alt="${escapeHtml(m.title)}">
    </div>`;
  }

  return `<div class="poster-placeholder ${extraClass||''}">${escapeHtml(m.title)}</div>`;
}

function movieCardHtml(m, wl) {
  return `
    <div class="poster-frame">
      ${m.matchConfidence === "niedrig" ? '<div class="low-confidence" title="Zuordnung unsicher">?</div>' : ""}
      ${m.fsk ? `<div class="fsk-badge">FSK ${m.fsk}</div>` : ""}
      <button class="fav ${wl.has(m.videoId) ? "active" : ""}" data-fav="${m.videoId}">♥</button>
      ${posterHtml(m)}
    </div>
    <div class="meta">
      <div>${escapeHtml(m.title)}</div>
      <div class="year">${(m.releaseDate || "").slice(0,4)} · ${genreNames(m.genreIds)}</div>
    </div>
  `;
}

function renderGrid(movies) {
  const grid = document.getElementById("grid");
  const wl = getWatchlist();
  document.getElementById("count").textContent = `${movies.length} Film${movies.length === 1 ? "" : "e"}`;

  // Jede Kachel ist ein echter Link auf die Seite des Films -- dadurch
  // funktionieren Mittelklick, "in neuem Tab öffnen" und Lesezeichen, und
  // Suchmaschinen können dem Verweis folgen.
  grid.innerHTML = movies.map(m =>
    `<a class="card" href="/film/${m.slug}">${movieCardHtml(m, wl)}</a>`
  ).join("");
  grid.querySelectorAll("[data-fav]").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const id = btn.dataset.fav;
      const isActive = toggleWatchlist(id);
      btn.classList.toggle("active", isActive);
      if (watchlistMode) applyFilters(); // Karte verschwindet ggf. aus der Merkliste-Ansicht
    });
  });
}

function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// Der Player und die Ähnliche-Filme-Liste sind entfallen: beides gehört
// jetzt auf die eigene Seite des Films, die auch für Suchmaschinen sichtbar
// ist und sich verlinken lässt.

let lastFiltered = [];
function currentlyShown() { return lastFiltered; }

// Sortiert die gefilterte Auswahl. "Standard" lässt die Reihenfolge so, wie
// sie ankommt -- bei aktiver Suche ist das die Treffergenauigkeit, sonst die
// Reihenfolge aus dem Index.
function sortiere(liste, modus) {
  if (!modus || modus === "relevanz") return liste;
  const kopie = [...liste];
  const jahr = m => parseInt((m.releaseDate || "").slice(0, 4), 10) || 0;

  switch (modus) {
    case "bewertung":
      // Filme ohne Bewertung ans Ende, nicht mit 0 dazwischen
      return kopie.sort((a, b) => (b.voteAverage || -1) - (a.voteAverage || -1));
    case "az":
      return kopie.sort((a, b) => a.title.localeCompare(b.title, "de"));
    case "za":
      return kopie.sort((a, b) => b.title.localeCompare(a.title, "de"));
    case "neu":
      return kopie.sort((a, b) => jahr(b) - jahr(a));
    case "alt":
      // Filme ohne Jahresangabe ans Ende statt an den Anfang
      return kopie.sort((a, b) => (jahr(a) || 9999) - (jahr(b) || 9999));
    default:
      return kopie;
  }
}

function applyFilters() {
  const query = document.getElementById("search").value.trim();
  const selectedGenre = document.getElementById("genreFilter").value;
  const selectedFsk = document.getElementById("fskFilter").value;
  const selectedJahrzehnt = document.getElementById("jahrFilter").value;

  let result = allMovies;
  if (query) {
    if (fuse) {
      result = fuse.search(query).map(r => r.item);
    } else {
      const q = query.toLowerCase();
      result = allMovies.filter(m =>
        (m.title || "").toLowerCase().includes(q) ||
        (m.originalTitle || "").toLowerCase().includes(q) ||
        (m.genreText || "").toLowerCase().includes(q) ||
        (m.cast || []).some(c => c.toLowerCase().includes(q)) ||
        (m.director || []).some(d => d.toLowerCase().includes(q))
      );
    }
  }

  if (selectedGenre) {
    result = result.filter(m => (m.genreIds || []).some(id => GENRES[id] === selectedGenre));
  }
  if (selectedFsk) {
    result = result.filter(m => m.fsk === selectedFsk);
  }
  if (selectedJahrzehnt) {
    const von = parseInt(selectedJahrzehnt, 10);
    result = result.filter(m => {
      const j = parseInt((m.releaseDate || "").slice(0, 4), 10);
      return j >= von && j < von + 10;
    });
  }
  if (watchlistMode) {
    const wl = getWatchlist();
    result = result.filter(m => wl.has(m.videoId));
  }
  result = sortiere(result, document.getElementById("sortierung").value);
  lastFiltered = result;
  renderGrid(result);
}

function updateClearButton() {
  const hasText = document.getElementById("search").value.length > 0;
  document.getElementById("searchClear").style.display = hasText ? "block" : "none";
}

document.getElementById("search").addEventListener("input", () => {
  updateClearButton();
  applyFilters();
});
document.getElementById("searchClear").addEventListener("click", () => {
  const input = document.getElementById("search");
  input.value = "";
  updateClearButton();
  input.focus();
  applyFilters();
});
updateClearButton(); // Anfangszustand setzen
document.getElementById("genreFilter").addEventListener("change", applyFilters);
document.getElementById("fskFilter").addEventListener("change", applyFilters);
document.getElementById("jahrFilter").addEventListener("change", applyFilters);
document.getElementById("sortierung").addEventListener("change", applyFilters);

// Zusätzliche, robustere Wege das Overlay zu schließen: Escape-Taste,
// Klick auf den dunklen Hintergrund außerhalb des Players
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    closeRandomPanel();
  }
});

function pickRandomMovies(pool, count) {
  const shuffled = [...pool].sort(() => Math.random() - 0.5);
  return shuffled.slice(0, count);
}

function openRandomPanel() {
  const pool = watchlistMode ? lastFiltered : allMovies;
  if (pool.length === 0) return;
  renderRandomGrid(pickRandomMovies(pool, 6));
  document.getElementById("randomOverlay").classList.add("open");
}

function renderRandomGrid(movies) {
  const grid = document.getElementById("randomGrid");
  const wl = getWatchlist();
  grid.innerHTML = movies.map(m =>
    `<a class="card" href="/film/${m.slug}">${movieCardHtml(m, wl)}</a>`
  ).join("");
  grid.querySelectorAll("[data-fav]").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const id = btn.dataset.fav;
      const isActive = toggleWatchlist(id);
      btn.classList.toggle("active", isActive);
    });
  });
}

function closeRandomPanel() {
  document.getElementById("randomOverlay").classList.remove("open");
}

document.getElementById("randomBtn").addEventListener("click", openRandomPanel);
document.getElementById("randomRerollBtn").addEventListener("click", () => {
  const pool = watchlistMode ? lastFiltered : allMovies;
  renderRandomGrid(pickRandomMovies(pool, 6));
});
document.getElementById("randomCloseBtn").addEventListener("click", closeRandomPanel);
document.getElementById("randomOverlay").addEventListener("click", (e) => {
  if (e.target.id === "randomOverlay") closeRandomPanel();
});

document.getElementById("watchlistBtn").addEventListener("click", (e) => {
  watchlistMode = !watchlistMode;
  e.target.classList.toggle("active", watchlistMode);
  applyFilters();
});

fetch(FILME_URL)
  .then(r => {
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  })
  .then(data => {
    // Der Index nutzt Kurzschlüssel, um Ladezeit zu sparen. Hier einmalig
    // auf die ausgeschriebenen Feldnamen abbilden.
    allMovies = data.map(d => ({
      videoId: d.v, slug: d.s, title: d.t, originalTitle: d.o,
      releaseDate: d.y ? d.y + "-01-01" : null,
      posterUrl: d.p, youtubeThumbnail: d.th, genreIds: d.g,
      fsk: d.f, voteAverage: d.r, matchConfidence: d.c,
      cast: d.ca, director: d.d,
    }));
    // Genre-Namen und Cast pro Film vorberechnen -- einmal hier statt bei
    // jeder Suche neu, und als eigene Suchfelder nutzbar
    allMovies.forEach(m => {
      m.genreText = (m.genreIds || []).map(id => GENRES[id]).filter(Boolean).join(" ");
    });

    lastFiltered = data;
    // Die Suchbibliothek kommt von einem fremden Anbieter. Ist sie nicht
    // erreichbar, darf das nicht die ganze Seite lahmlegen -- dann wird auf
    // eine einfache Textsuche zurückgefallen.
    if (typeof Fuse === "function") {
      fuse = new Fuse(allMovies, { keys: ["title", "originalTitle", "genreText", "cast", "director", "writer"], threshold: 0.3 });
    } else {
      fuse = null;
      console.warn("Suchbibliothek nicht geladen -- einfache Textsuche aktiv.");
    }

    populateGenreFilter(allMovies);
    populateJahrFilter(allMovies);
    document.getElementById("status").style.display = "none";
    renderGrid(allMovies);
  })
  .catch(err => {
    document.getElementById("status").textContent = "Fehler beim Laden: " + err.message;
  });

function populateGenreFilter(movies) {
  const present = new Set();
  movies.forEach(m => (m.genreIds || []).forEach(id => GENRES[id] && present.add(GENRES[id])));
  const select = document.getElementById("genreFilter");
  [...present].sort((a, b) => a.localeCompare(b, "de")).forEach(name => {
    const opt = document.createElement("option");
    opt.value = name;
    opt.textContent = name;
    select.appendChild(opt);
  });
}

// Der Bestand reicht von 1915 bis heute -- über hundert einzelne Jahrgänge
// wären als Auswahlliste unbrauchbar. Deshalb nach Jahrzehnten gruppiert,
// und nur die, zu denen es auch wirklich Filme gibt.
function populateJahrFilter(movies) {
  const jahrzehnte = new Set();
  movies.forEach(m => {
    const j = parseInt((m.releaseDate || "").slice(0, 4), 10);
    if (j > 1880 && j < 2100) jahrzehnte.add(Math.floor(j / 10) * 10);
  });

  const select = document.getElementById("jahrFilter");
  [...jahrzehnte].sort((a, b) => b - a).forEach(d => {
    const opt = document.createElement("option");
    opt.value = String(d);
    opt.textContent = `${d}er`;
    select.appendChild(opt);
  });
}
