name: YouTube Scan

on:
  workflow_dispatch: {}     # manueller Start über den "Run workflow"-Button
  schedule:
    - cron: "0 2 * * *"     # 02:00 UTC = 03:00 oder 04:00 MEZ/MESZ, je nach Jahreszeit

permissions:
  contents: write            # damit die Action Ergebnisse zurückcommitten darf

# Alle Workflows, die Daten schreiben, teilen sich diese Warteschlange.
# Startet einer, während ein anderer läuft, wartet er -- statt parallel an
# denselben Dateien zu arbeiten. Genau das hat am 24.09. einen 29-minütigen
# Lauf scheitern lassen: Der zeitgesteuerte Scan (von GitHub um Stunden
# verschoben) committete, während die Neu-Zuordnung noch lief.
concurrency:
  group: tubefilme-daten
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: YouTube-Daten abrufen
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/fetch-youtube.js

      - name: Shorts/Trailer/Serien rausfiltern
        run: node scripts/filter-movies.js

      - name: TMDB-Metadaten zuordnen
        env:
          TMDB_BEARER_TOKEN: ${{ secrets.TMDB_BEARER_TOKEN }}
        run: node scripts/match-tmdb.js

      # Einträge mit von Hand ermitteltem Titel (data/titel-korrekturen.json)
      # mit diesem Titel bei TMDB suchen -- nur wenige Dutzend, deshalb auch
      # nächtlich. Die volle Nachsuche über alle übernommenen Filme bleibt
      # der Neu-Zuordnung vorbehalten.
      - name: Von Hand betitelte Filme bei TMDB nachsuchen
        env:
          TMDB_BEARER_TOKEN: ${{ secrets.TMDB_BEARER_TOKEN }}
        run: node scripts/match-tmdb.js --youtube-nachsuche --nur-korrekturen

      # Laufzeit aus TMDB nachladen -- Grundlage für den Laufzeitvergleich der
      # Plausibilitätsprüfung (nur Filme ohne das Feld, beim ersten Lauf alle).
      - name: Laufzeiten nachladen
        env:
          TMDB_BEARER_TOKEN: ${{ secrets.TMDB_BEARER_TOKEN }}
        run: node scripts/fetch-runtime.js

      # Neue Zuordnungen auf Plausibilität prüfen; nicht belegbare werden
      # gesperrt und beim nächsten Lauf neu gesucht.
      - name: Zuordnungen auf Plausibilität prüfen
        env:
          TMDB_BEARER_TOKEN: ${{ secrets.TMDB_BEARER_TOKEN }}
        run: node scripts/verify-plausibility.js

      - name: Datenqualität bereinigen (Duplikate)
        run: node scripts/cleanup-matches.js

      - name: Dokumentationen entfernen (nur Spielfilme)
        run: node scripts/remove-documentaries.js

      - name: Nach neuen Filterregeln aussortieren (rückwirkend)
        run: node scripts/prune-excluded.js

      - name: Unsichere Zuordnungen automatisch nachprüfen
        run: node scripts/auto-verify.js

      - name: Nicht auffindbare Filme aus YouTube-Daten übernehmen
        run: node scripts/absorb-unmatched.js

      - name: Werbeüberschriften in Titeln bereinigen
        run: node scripts/fix-titles.js

      - name: Cast-Daten für Schauspieler-Suche nachladen
        env:
          TMDB_BEARER_TOKEN: ${{ secrets.TMDB_BEARER_TOKEN }}
        run: node scripts/fetch-cast.js

      - name: FSK-Einstufung nachladen
        env:
          TMDB_BEARER_TOKEN: ${{ secrets.TMDB_BEARER_TOKEN }}
        run: node scripts/fetch-fsk.js

      # Täglich prüfen, ob die Videos noch abspielbar sind (gelöscht, privat,
      # nicht einbettbar, in Deutschland gesperrt). Rund 150 Abfragen für die
      # ganze Bibliothek -- billig. Schlägt die Prüfung fehl (Kontingent),
      # läuft der Scan trotzdem weiter; repair-unavailable arbeitet dann mit
      # dem letzten Stand.
      - name: Verfügbarkeit bei YouTube prüfen
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/check-availability.js

      - name: Nicht abspielbare Filme reparieren
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/repair-unavailable.js

      - name: Seite bauen (Index, Filmseiten, Sitemap)
        run: node scripts/build-site.js

      - name: Ergebnisse committen
        run: |
          git config user.name "tubefilme-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ film/ index.html sitemap.xml robots.txt
          if git diff --staged --quiet; then
            echo "Keine Änderungen."
            exit 0
          fi
          git commit -m "Automatischer Scan: $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Während des Laufs eingespielten Code übernehmen (etwa ein
          # aktualisiertes Skript). Andere Workflows laufen dank der
          # Warteschlange nie parallel. Kollidiert trotzdem eine Datendatei --
          # z.B. weil währenddessen über die Review-Seite gespeichert wurde --
          # wird abgebrochen statt überschrieben.
          if ! git pull --rebase origin main; then
            git rebase --abort
            echo "::error::Konflikt mit einer zwischenzeitlichen Änderung an denselben Daten. Nichts wurde überschrieben -- Workflow bitte erneut starten."
            exit 1
          fi
          git push
