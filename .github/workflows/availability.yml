name: Verfügbarkeit prüfen

# Läuft nur auf Knopfdruck. Prüft, welche Filme bei YouTube nicht mehr
# abspielbar sind, und schreibt das Ergebnis nach data/unavailable.json.
# Die Bibliothek selbst wird dabei NICHT verändert.
on:
  workflow_dispatch:
    inputs:
      kanal:
        description: "Nur einen Kanal prüfen (Name genau wie in channels.json). Leer = alle."
        required: false
        default: ""
      video:
        description: "Nur ein einzelnes Video prüfen (videoId). Hat Vorrang vor Kanal."
        required: false
        default: ""
      limit:
        description: "Höchstens so viele Filme prüfen (leer = ohne Begrenzung)."
        required: false
        default: ""

permissions:
  contents: write

# Alle Workflows, die Daten schreiben, teilen sich diese Warteschlange.
# Startet einer, während ein anderer läuft, wartet er -- statt parallel an
# denselben Dateien zu arbeiten. Genau das hat am 24.09. einen 29-minütigen
# Lauf scheitern lassen: Der zeitgesteuerte Scan (von GitHub um Stunden
# verschoben) committete, während die Neu-Zuordnung noch lief.
concurrency:
  group: tubefilme-daten
  cancel-in-progress: false

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verfügbarkeit prüfen
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          KANAL: ${{ inputs.kanal }}
          VIDEO: ${{ inputs.video }}
          LIMIT: ${{ inputs.limit }}
        run: |
          ARGS=""
          if [ -n "$VIDEO" ]; then ARGS="--video $VIDEO";
          elif [ -n "$KANAL" ]; then ARGS="--kanal \"$KANAL\""; fi
          if [ -n "$LIMIT" ]; then ARGS="$ARGS --limit $LIMIT"; fi
          eval node scripts/check-availability.js $ARGS

      - name: Nicht abspielbare Filme reparieren
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/repair-unavailable.js

      - name: Seite neu bauen
        run: node scripts/build-site.js

      - name: Ergebnis committen
        run: |
          git config user.name "tubefilme-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ film/ index.html sitemap.xml robots.txt
          if git diff --staged --quiet; then
            echo "Keine Änderungen."
            exit 0
          fi
          git commit -m "Verfügbarkeitsprüfung: $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Während des Laufs eingespielten Code übernehmen (etwa ein
          # aktualisiertes Skript). Andere Workflows laufen dank der
          # Warteschlange nie parallel. Kollidiert trotzdem eine Datendatei --
          # z.B. weil währenddessen über die Review-Seite gespeichert wurde --
          # wird abgebrochen statt überschrieben.
          if ! git pull --rebase origin main; then
            git rebase --abort
            echo "::error::Konflikt mit einer zwischenzeitlichen Änderung an denselben Daten. Nichts wurde überschrieben -- Workflow bitte erneut starten."
            exit 1
          fi
          git push
